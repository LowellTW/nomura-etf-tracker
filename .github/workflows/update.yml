name: Update ETF data

on:
  workflow_dispatch:
  schedule:
    - cron: "40 6 * * 1-5"
      timezone: "Asia/Taipei"

permissions:
  contents: write

concurrency:
  group: update-etf-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: PYTHONPATH=src python -m unittest discover -s tests
      - name: Fetch and normalize
        run: |
          for attempt in {0..6}; do
            PYTHONPATH=src python -m nomura_tracker && exit 0
            if [ "$attempt" -lt 6 ]; then
              echo "Target data not ready; retrying in 20 minutes ($((attempt + 1))/6)"
              sleep 1200
            fi
          done
          exit 1
      - name: Commit changed snapshots
        run: |
          git add data
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: update ETF snapshots"
          git push
